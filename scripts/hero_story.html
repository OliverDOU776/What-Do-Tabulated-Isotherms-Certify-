<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What Do Tabulated Isotherms Certify? — IsoCert</title>
<style>
  body{margin:0;background:#fff}
  svg {
    display: block;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Technical rule: every animated element uses 16s linear 0s infinite */
  .anim {
    animation-duration: 16s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    animation-delay: 0s;
  }

  /* ================= SCENE VISIBILITY & PROGRESS DOTS ================= */
  /* Scene 5 holds final state until 15.6s (97.5%), then fades to Scene 1 within last 0.4s (97.5%..100%) */
  .scene1 { animation-name: kf-scene1; }
  @keyframes kf-scene1 {
    0%, 17.1875% { opacity: 1; }
    19.0625%, 97.5% { opacity: 0; }
    100% { opacity: 1; }
  }

  .scene2-5-base { animation-name: kf-scene2-5-base; }
  @keyframes kf-scene2-5-base {
    0%, 17.5% { opacity: 0; }
    19.375%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  .scene2-only { animation-name: kf-scene2-only; }
  @keyframes kf-scene2-only {
    0%, 17.5% { opacity: 0; }
    19.375%, 36.25% { opacity: 1; }
    38.125%, 100% { opacity: 0; }
  }

  .scene3-5-base { animation-name: kf-scene3-5-base; }
  @keyframes kf-scene3-5-base {
    0%, 36.5625% { opacity: 0; }
    38.4375%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  .scene3-only { animation-name: kf-scene3-only; }
  @keyframes kf-scene3-only {
    0%, 36.5625% { opacity: 0; }
    38.4375%, 58.125% { opacity: 1; }
    60%, 100% { opacity: 0; }
  }

  .scene4-only { animation-name: kf-scene4-only; }
  @keyframes kf-scene4-only {
    0%, 58.4375% { opacity: 0; }
    60.3125%, 76.875% { opacity: 1; }
    78.75%, 100% { opacity: 0; }
  }

  .scene5-only { animation-name: kf-scene5-only; }
  @keyframes kf-scene5-only {
    0%, 77.1875% { opacity: 0; }
    79.0625%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Progress dots at top right */
  .pdot1 { animation-name: kf-scene1; }
  .pdot2 { animation-name: kf-scene2-only; }
  .pdot3 { animation-name: kf-scene3-only; }
  .pdot4 { animation-name: kf-scene4-only; }
  .pdot5 { animation-name: kf-scene5-only; }

  /* ================= SCENE 1: MOLECULE MOTION ================= */
  /* 5 CO2 molecules travel along pore-row lanes (y=215, 280, 345) from stack/plume into 5 distinct pores and stop.
     In rows with 2 molecules (Row 1 and Row 3), the Col 3 (x=736) molecule starts well ahead of the Col 1 (x=568)
     molecule so no molecule ever overlaps another in flight or at rest. */

  /* Row 1, Col 1 pore (568, 215) */
  .co2-m1 { animation-name: kf-co2-m1; }
  @keyframes kf-co2-m1 {
    0% { opacity: 1; transform: translate(220px, 210px); }
    3.5% { opacity: 1; transform: translate(355px, 213px); }
    7.0% { opacity: 1; transform: translate(485px, 215px); }
    9.5% { opacity: 1; transform: translate(552px, 215px); }
    10.8%, 19.2% { opacity: 1; transform: translate(568px, 215px); }
    19.5%, 97.4% { opacity: 0; transform: translate(220px, 210px); }
    97.5%, 100% { opacity: 1; transform: translate(220px, 210px); }
  }

  /* Row 2, Col 2 pore (652, 280) */
  .co2-m2 { animation-name: kf-co2-m2; }
  @keyframes kf-co2-m2 {
    0% { opacity: 1; transform: translate(275px, 276px); }
    3.5% { opacity: 1; transform: translate(425px, 279px); }
    7.0% { opacity: 1; transform: translate(565px, 280px); }
    9.2% { opacity: 1; transform: translate(636px, 280px); }
    10.5%, 19.2% { opacity: 1; transform: translate(652px, 280px); }
    19.5%, 97.4% { opacity: 0; transform: translate(275px, 276px); }
    97.5%, 100% { opacity: 1; transform: translate(275px, 276px); }
  }

  /* Row 3, Col 1 pore (568, 345) */
  .co2-m3 { animation-name: kf-co2-m3; }
  @keyframes kf-co2-m3 {
    0% { opacity: 1; transform: translate(225px, 338px); }
    3.5% { opacity: 1; transform: translate(355px, 342px); }
    7.0% { opacity: 1; transform: translate(480px, 345px); }
    9.8% { opacity: 1; transform: translate(552px, 345px); }
    11.0%, 19.2% { opacity: 1; transform: translate(568px, 345px); }
    19.5%, 97.4% { opacity: 0; transform: translate(225px, 338px); }
    97.5%, 100% { opacity: 1; transform: translate(225px, 338px); }
  }

  /* Row 1, Col 3 pore (736, 215) — starts ahead of co2-m1 */
  .co2-m4 { animation-name: kf-co2-m4; }
  @keyframes kf-co2-m4 {
    0% { opacity: 1; transform: translate(365px, 215px); }
    3.5% { opacity: 1; transform: translate(525px, 215px); }
    6.8% { opacity: 1; transform: translate(670px, 215px); }
    8.8% { opacity: 1; transform: translate(724px, 215px); }
    10.0%, 19.2% { opacity: 1; transform: translate(736px, 215px); }
    19.5%, 97.4% { opacity: 0; transform: translate(365px, 215px); }
    97.5%, 100% { opacity: 1; transform: translate(365px, 215px); }
  }

  /* Row 3, Col 3 pore (736, 345) — starts ahead of co2-m3 */
  .co2-m5 { animation-name: kf-co2-m5; }
  @keyframes kf-co2-m5 {
    0% { opacity: 1; transform: translate(375px, 345px); }
    3.5% { opacity: 1; transform: translate(535px, 345px); }
    6.8% { opacity: 1; transform: translate(675px, 345px); }
    8.8% { opacity: 1; transform: translate(724px, 345px); }
    10.0%, 19.2% { opacity: 1; transform: translate(736px, 345px); }
    19.5%, 97.4% { opacity: 0; transform: translate(375px, 345px); }
    97.5%, 100% { opacity: 1; transform: translate(375px, 345px); }
  }

  /* N2 molecules travel through the 3 horizontal crystal channels (y=184, 248, 314)
     and exit on the right along or right next to the dashed arrow (y=238..258), far from all labels. */

  /* Channel 1 (y=184) -> exits along dashed arrow (y=238) */
  .n2-m1 { animation-name: kf-n2-m1; }
  @keyframes kf-n2-m1 {
    0% { opacity: 1; transform: translate(255px, 184px); }
    5.5% { opacity: 1; transform: translate(535px, 184px); }
    10.8% { opacity: 1; transform: translate(825px, 184px); }
    12.5% { opacity: 1; transform: translate(895px, 238px); }
    17.5% { opacity: 1; transform: translate(1155px, 238px); }
    18.8%, 97.4% { opacity: 0; transform: translate(1205px, 238px); }
    97.5%, 100% { opacity: 1; transform: translate(255px, 184px); }
  }

  /* Channel 2 (y=248) -> exits directly on dashed arrow (y=248) */
  .n2-m2 { animation-name: kf-n2-m2; }
  @keyframes kf-n2-m2 {
    0% { opacity: 1; transform: translate(355px, 248px); }
    5.5% { opacity: 1; transform: translate(655px, 248px); }
    9.0% { opacity: 1; transform: translate(845px, 248px); }
    15.0% { opacity: 1; transform: translate(1155px, 248px); }
    16.5%, 97.4% { opacity: 0; transform: translate(1210px, 248px); }
    97.5%, 100% { opacity: 1; transform: translate(355px, 248px); }
  }

  /* Channel 2 second wave (y=248) -> exits directly on dashed arrow (y=248) */
  .n2-m3 { animation-name: kf-n2-m3; }
  @keyframes kf-n2-m3 {
    0% { opacity: 0; transform: translate(215px, 248px); }
    1.5% { opacity: 1; transform: translate(240px, 248px); }
    7.5% { opacity: 1; transform: translate(555px, 248px); }
    13.0% { opacity: 1; transform: translate(845px, 248px); }
    18.2% { opacity: 1; transform: translate(1115px, 248px); }
    19.2%, 100% { opacity: 0; transform: translate(1155px, 248px); }
  }

  /* Channel 3 (y=314) -> exits along dashed arrow (y=258) */
  .n2-m4 { animation-name: kf-n2-m4; }
  @keyframes kf-n2-m4 {
    0% { opacity: 1; transform: translate(295px, 314px); }
    5.0% { opacity: 1; transform: translate(560px, 314px); }
    10.0% { opacity: 1; transform: translate(825px, 314px); }
    11.8% { opacity: 1; transform: translate(895px, 258px); }
    17.0% { opacity: 1; transform: translate(1155px, 258px); }
    18.5%, 97.4% { opacity: 0; transform: translate(1205px, 258px); }
    97.5%, 100% { opacity: 1; transform: translate(295px, 314px); }
  }

  /* Channel 1 early leader (y=184) -> exits along dashed arrow (y=238) */
  .n2-m5 { animation-name: kf-n2-m5; }
  @keyframes kf-n2-m5 {
    0% { opacity: 1; transform: translate(545px, 184px); }
    5.0% { opacity: 1; transform: translate(825px, 184px); }
    6.8% { opacity: 1; transform: translate(895px, 238px); }
    12.5% { opacity: 1; transform: translate(1160px, 238px); }
    14.0%, 97.4% { opacity: 0; transform: translate(1210px, 238px); }
    97.5%, 100% { opacity: 1; transform: translate(545px, 184px); }
  }

  /* ================= SCENE 2: 7 DOTS APPEAR ONE BY ONE ================= */
  .dot-1 { animation-name: kf-dot-1; }
  @keyframes kf-dot-1 {
    0%, 19.5% { opacity: 0; }
    20.8%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-2 { animation-name: kf-dot-2; }
  @keyframes kf-dot-2 {
    0%, 21.3% { opacity: 0; }
    22.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-3 { animation-name: kf-dot-3; }
  @keyframes kf-dot-3 {
    0%, 23.1% { opacity: 0; }
    24.4%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-4 { animation-name: kf-dot-4; }
  @keyframes kf-dot-4 {
    0%, 24.9% { opacity: 0; }
    26.2%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-5 { animation-name: kf-dot-5; }
  @keyframes kf-dot-5 {
    0%, 26.7% { opacity: 0; }
    28.0%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-6 { animation-name: kf-dot-6; }
  @keyframes kf-dot-6 {
    0%, 28.5% { opacity: 0; }
    29.8%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot-7 { animation-name: kf-dot-7; }
  @keyframes kf-dot-7 {
    0%, 30.3% { opacity: 0; }
    31.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ================= SCENE 3: FAN OF RED CURVES & RED TICKS ================= */
  /* Shaded region "the mixture calculation reads here" */
  .shade-read { animation-name: kf-shade-read; }
  @keyframes kf-shade-read {
    0%, 37.5% { opacity: 0; }
    39.5%, 77.5% { opacity: 1; }
    80.5%, 97.5% { opacity: 0.35; }
    100% { opacity: 0; }
  }

  /* Wide fan of red curves on N2 chart: appears in Scene 3, persists in Scene 4, collapses in Scene 5 */
  .fan-wide {
    transform-origin: 0px 0px;
    animation-name: kf-fan-wide;
  }
  @keyframes kf-fan-wide {
    0%, 38.2% { opacity: 0; transform: scaleY(1); }
    41.0%, 80.5% { opacity: 1; transform: scaleY(1); }
    82.5% { opacity: 0.75; transform: scaleY(0.55); }
    84.5% { opacity: 0.25; transform: scaleY(0.18); }
    85.8%, 100% { opacity: 0; transform: scaleY(0.08); }
  }

  /* Collapsed narrow red band in Scene 5 */
  .fan-narrow { animation-name: kf-fan-narrow; }
  @keyframes kf-fan-narrow {
    0%, 81.5% { opacity: 0; }
    85.0%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Red tick marks on selectivity axis (217 to 2,018) */
  .red-ticks { animation-name: kf-red-ticks; }
  @keyframes kf-red-ticks {
    0%, 40.0% { opacity: 0; }
    43.0%, 58.5% { opacity: 1; }
    61.0%, 77.5% { opacity: 0.32; }
    79.5%, 100% { opacity: 0; }
  }

  .red-tick-labels { animation-name: kf-red-tick-labels; }
  @keyframes kf-red-tick-labels {
    0%, 40.5% { opacity: 0; }
    43.5%, 58.125% { opacity: 1; }
    60.0%, 100% { opacity: 0; }
  }

  /* Question mark badge "Is S >= 300?" */
  .badge-q { animation-name: kf-badge-q; }
  @keyframes kf-badge-q {
    0%, 42.5% { opacity: 0; }
    45.0%, 58.125% { opacity: 1; }
    60.0%, 100% { opacity: 0; }
  }

  /* ================= SCENE 4: ISOCERT BAR (178 TO 15,497), AMBER BADGE, TEAL NOTE ================= */
  /* Grey-blue bar grows from 178 (x=320) to 15,497 (x=941, width=621), then shrinks in Scene 5 to 421..2,810 (x=440..703, width=263) */
  .bar-isocert-wide {
    transform-box: fill-box;
    transform-origin: left center;
    animation-name: kf-bar-isocert-wide;
  }
  @keyframes kf-bar-isocert-wide {
    0%, 59.0% { opacity: 0; transform: translateX(0px) scaleX(0.02); }
    60.0% { opacity: 1; transform: translateX(0px) scaleX(0.18); }
    61.5% { opacity: 1; transform: translateX(0px) scaleX(0.55); }
    63.0% { opacity: 1; transform: translateX(0px) scaleX(0.86); }
    64.5%, 81.25% { opacity: 1; transform: translateX(0px) scaleX(1); }
    83.0% { opacity: 0.85; transform: translateX(48px) scaleX(0.75); }
    84.75% { opacity: 0.45; transform: translateX(98px) scaleX(0.52); }
    86.25%, 100% { opacity: 0; transform: translateX(120px) scaleX(0.42351); }
  }

  .s4-bar-labels { animation-name: kf-s4-bar-labels; }
  @keyframes kf-s4-bar-labels {
    0%, 62.5% { opacity: 0; }
    64.8%, 77.5% { opacity: 1; }
    79.5%, 100% { opacity: 0; }
  }

  .badge-undetermined { animation-name: kf-badge-undetermined; }
  @keyframes kf-badge-undetermined {
    0%, 63.0% { opacity: 0; }
    65.2%, 77.2% { opacity: 1; }
    79.0%, 100% { opacity: 0; }
  }

  .note-advice { animation-name: kf-note-advice; }
  @keyframes kf-note-advice {
    0%, 66.0% { opacity: 0; transform: translateY(8px); }
    68.5%, 77.2% { opacity: 1; transform: translateY(0px); }
    79.0%, 100% { opacity: 0; transform: translateY(0px); }
  }

  /* ================= SCENE 5: 4 NEW N2 DOTS (UP TO 10 BAR), STRONG BLUE BAR (421..2,810), GREEN BADGE ================= */
  .new-dot-1 { animation-name: kf-new-dot-1; }
  @keyframes kf-new-dot-1 {
    0%, 78.5% { opacity: 0; }
    79.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .new-dot-2 { animation-name: kf-new-dot-2; }
  @keyframes kf-new-dot-2 {
    0%, 79.5% { opacity: 0; }
    80.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .new-dot-3 { animation-name: kf-new-dot-3; }
  @keyframes kf-new-dot-3 {
    0%, 80.5% { opacity: 0; }
    81.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
  .new-dot-4 { animation-name: kf-new-dot-4; }
  @keyframes kf-new-dot-4 {
    0%, 81.5% { opacity: 0; }
    82.6%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Strong blue bar shrinks into 421 (x=440) to 2,810 (x=703), width=263, held fully visible until 15.6s (97.5%) */
  .bar-isocert-strong {
    transform-box: fill-box;
    transform-origin: left center;
    animation-name: kf-bar-isocert-strong;
  }
  @keyframes kf-bar-isocert-strong {
    0%, 81.25% { opacity: 0; transform: translateX(-120px) scaleX(2.3612); }
    83.0% { opacity: 0.45; transform: translateX(-72px) scaleX(1.7709); }
    84.75% { opacity: 0.85; transform: translateX(-22px) scaleX(1.2278); }
    86.25%, 97.5% { opacity: 1; transform: translateX(0px) scaleX(1); }
    100% { opacity: 0; transform: translateX(0px) scaleX(1); }
  }

  .s5-bar-labels { animation-name: kf-s5-bar-labels; }
  @keyframes kf-s5-bar-labels {
    0%, 84.2% { opacity: 0; }
    86.25%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Green badge "YES, certain" held fully visible from 86.25% (13.80s) to 97.5% (15.60s) = 1.80s, then fades over last 0.4s */
  .badge-yes { animation-name: kf-badge-yes; }
  @keyframes kf-badge-yes {
    0%, 84.2% { opacity: 0; }
    86.25%, 97.5% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Reusable CO2 molecule: 3 balls in a line (red O #c36464, dark grey C #465462, red O #c36464) -->
    <g id="mol-co2">
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-17" cy="0" r="9.5" fill="#c36464" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-19.5" cy="-3" r="2.5" fill="#ffffff" opacity="0.45"/>
      <circle cx="0" cy="0" r="10.5" fill="#465462" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-2.5" cy="-3.5" r="2.5" fill="#ffffff" opacity="0.35"/>
      <circle cx="17" cy="0" r="9.5" fill="#c36464" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="14.5" cy="-3" r="2.5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Reusable N2 molecule: 2 blue balls (#557aab) -->
    <g id="mol-n2">
      <circle cx="-8.5" cy="0" r="9.5" fill="#557aab" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-11" cy="-3" r="2.5" fill="#ffffff" opacity="0.45"/>
      <circle cx="8.5" cy="0" r="9.5" fill="#557aab" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="6" cy="-3" r="2.5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Reusable Zeolite Pore Cage Unit -->
    <g id="pore-cage">
      <rect x="-36" y="-22" width="72" height="44" rx="12" fill="#ffffff" stroke="#589e95" stroke-width="3.5"/>
      <rect x="-30" y="-16" width="60" height="32" rx="9" fill="#eef7f6" stroke="#c1ddd8" stroke-width="2"/>
    </g>
  </defs>

  <!-- ==================== PROGRESS DOTS (TOP RIGHT) ==================== -->
  <g transform="translate(1135, 24)">
    <circle cx="0" cy="0" r="6" fill="#dfe4e8"/>
    <circle cx="24" cy="0" r="6" fill="#dfe4e8"/>
    <circle cx="48" cy="0" r="6" fill="#dfe4e8"/>
    <circle cx="72" cy="0" r="6" fill="#dfe4e8"/>
    <circle cx="96" cy="0" r="6" fill="#dfe4e8"/>

    <circle class="anim pdot1" cx="0" cy="0" r="6" fill="#2973ac"/>
    <circle class="anim pdot2" cx="24" cy="0" r="6" fill="#2973ac"/>
    <circle class="anim pdot3" cx="48" cy="0" r="6" fill="#2973ac"/>
    <circle class="anim pdot4" cx="72" cy="0" r="6" fill="#2973ac"/>
    <circle class="anim pdot5" cx="96" cy="0" r="6" fill="#2973ac"/>
  </g>

  <!-- ==================== SCENE 1 (0.0 - 3.0 s) ==================== -->
  <g class="anim scene1">
    <!-- Molecule Legend Pill (Top Left) -->
    <g transform="translate(75, 42)">
      <rect x="0" y="0" width="320" height="52" rx="12" fill="#f7f9fb" stroke="#dfe4e8" stroke-width="2"/>
      <use href="#mol-co2" x="45" y="26"/>
      <text x="82" y="34" font-size="24" font-weight="bold" fill="#30363d">CO₂</text>
      <use href="#mol-n2" x="195" y="26"/>
      <text x="225" y="34" font-size="24" font-weight="bold" fill="#30363d">N₂</text>
    </g>

    <!-- Soft Round Flue-Gas Puffs Ending Well Before the Crystal (no clipped edge anywhere) -->
    <g id="flue-gas-puffs">
      <circle cx="222" cy="172" r="26" fill="#dfe4e8" opacity="0.65"/>
      <circle cx="258" cy="166" r="34" fill="#eef3f6" opacity="0.88"/>
      <circle cx="304" cy="172" r="38" fill="#eef3f6" opacity="0.85"/>
      <circle cx="352" cy="186" r="36" fill="#eef3f6" opacity="0.75"/>
      <circle cx="255" cy="212" r="36" fill="#eef3f6" opacity="0.82"/>
      <circle cx="308" cy="224" r="44" fill="#eef3f6" opacity="0.80"/>
      <circle cx="358" cy="236" r="38" fill="#eef3f6" opacity="0.72"/>
      <circle cx="275" cy="268" r="38" fill="#eef3f6" opacity="0.75"/>
      <circle cx="328" cy="282" r="40" fill="#eef3f6" opacity="0.70"/>
      <circle cx="370" cy="292" r="30" fill="#eef3f6" opacity="0.58"/>
      <circle cx="298" cy="326" r="34" fill="#eef3f6" opacity="0.62"/>
      <circle cx="344" cy="334" r="28" fill="#eef3f6" opacity="0.52"/>
      <text x="304" y="122" font-size="24" font-weight="bold" fill="#67727d" text-anchor="middle">flue gas</text>
    </g>

    <!-- Factory & Smokestack on the Left -->
    <g transform="translate(75, 165)">
      <!-- Tall Smokestack -->
      <polygon points="105,15 145,15 158,155 92,155" fill="#67727d" stroke="#30363d" stroke-width="3" stroke-linejoin="round"/>
      <rect x="100" y="8" width="50" height="12" rx="4" fill="#465462" stroke="#30363d" stroke-width="2.5"/>
      <rect x="103" y="32" width="44" height="10" fill="#c0564b"/>
      <rect x="101" y="54" width="48" height="10" fill="#dfe4e8"/>
      <!-- Factory Body with Sawtooth Roof -->
